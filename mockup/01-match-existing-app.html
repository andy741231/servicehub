<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service Hub — Login (Match Existing App)</title>
<style>
  /* ---- Service Hub brand tokens (from index.css, light mode) ---- */
  :root {
    --primary:            hsl(175 84% 32%);   /* #0D9488 teal-600 */
    --primary-hover:      hsl(175 77% 26%);   /* #0F766E teal-700 */
    --primary-light:      hsl(166 76% 97%);   /* #F0FDFA teal-50 */
    --primary-foreground: hsl(0 0% 100%);
    --background:         hsl(160 43% 99%);   /* #FAFDFC */
    --surface:            hsl(0 0% 100%);
    --border:             hsl(214 32% 91%);   /* #E2E8F0 slate-200 */
    --border-strong:      hsl(213 27% 84%);   /* #CBD5E1 slate-300 */
    --text-base:          hsl(176 21% 14%);   /* #1C2B2A */
    --text-muted:         hsl(215 16% 47%);   /* #64748B slate-500 */
    --text-subtle:        hsl(215 20% 65%);   /* #94A3B8 slate-400 */
    --radius-base: 10px;
    --radius-card: 16px;
    --shadow-modal: 0 20px 25px -5px rgba(13,148,136,0.10), 0 10px 10px -5px rgba(15,23,42,0.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--background);
    color: var(--text-base);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1rem;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 28rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-modal);
    padding: 2rem;
  }
  .header { text-align: center; margin-bottom: 2rem; }
  .logo {
    width: 3.5rem; height: 3.5rem;
    border-radius: 1rem;
    background: var(--primary-light);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
  }
  .logo svg { width: 1.75rem; height: 1.75rem; }
  .wordmark {
    font-size: 1.5rem; font-weight: 700; color: var(--text-base);
    letter-spacing: -0.01em;
  }
  .wordmark span { color: var(--primary); }
  .subtitle { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; }
  form { display: flex; flex-direction: column; gap: 1.25rem; }
  .field { display: flex; flex-direction: column; gap: 0.375rem; }
  label { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }
  .input-wrap { position: relative; }
  .input-wrap svg {
    position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
    width: 1rem; height: 1rem; color: var(--text-subtle);
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 0.625rem 1rem 0.625rem 2.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-base);
    font-size: 0.875rem;
    color: var(--text-base);
    min-height: 44px;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--text-subtle); }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px hsl(175 84% 32% / 0.35);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .remember { display: flex; align-items: center; gap: 0.5rem; }
  .remember input { width: 1rem; height: 1rem; accent-color: var(--primary); cursor: pointer; }
  .remember label { font-size: 0.875rem; color: var(--text-muted); cursor: pointer; }
  .forgot { font-size: 0.875rem; color: var(--primary); text-decoration: none; font-weight: 500; }
  .forgot:hover { color: var(--primary-hover); text-decoration: underline; }
  .btn {
    width: 100%;
    padding: 0.625rem 1rem;
    background: var(--primary);
    color: var(--primary-foreground);
    border: none;
    border-radius: var(--radius-base);
    font-size: 0.875rem; font-weight: 500;
    min-height: 44px;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn:active { transform: scale(0.98); }
  .footer { text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo" aria-hidden="true">
        <!-- LogIn icon (lucide) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </div>
      <div class="wordmark">Service<span>Hub</span></div>
      <p class="subtitle">Sign in to access the admin dashboard.</p>
    </div>

    <form onsubmit="event.preventDefault()">
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="username" type="text" placeholder="Username" autocomplete="username" />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        </div>
      </div>

      <div class="row">
        <div class="remember">
          <input id="remember-me" type="checkbox" />
          <label for="remember-me">Remember me</label>
        </div>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Sign in</button>
    </form>

    <p class="footer">© 2026 Service Hub. All rights reserved.</p>
  </div>
</body>
</html>
