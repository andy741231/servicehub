<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service Hub — Login (Glassmorphism)</title>
<style>
  :root {
    --primary:            hsl(175 84% 42%);
    --primary-hover:      hsl(175 77% 36%);
    --primary-foreground: hsl(0 0% 100%);
    --text-base:          hsl(0 0% 100%);
    --text-muted:         hsla(0 0% 100%, 0.78);
    --text-subtle:        hsla(0 0% 100%, 0.55);
    --radius-base: 12px;
    --radius-card: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
    color: var(--text-base);
    /* colorful animated gradient backdrop */
    background: linear-gradient(135deg, hsl(175 84% 28%), hsl(200 80% 22%), hsl(258 70% 30%));
    background-size: 200% 200%;
    animation: shift 14s ease infinite;
    position: relative;
    overflow: hidden;
  }
  @keyframes shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  /* floating blurred blobs for depth */
  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.6;
    pointer-events: none;
  }
  body::before {
    width: 420px; height: 420px;
    background: hsl(175 84% 50%);
    top: -120px; left: -80px;
  }
  body::after {
    width: 380px; height: 380px;
    background: hsl(258 80% 55%);
    bottom: -120px; right: -60px;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 24rem;
    background: hsla(0 0% 100%, 0.1);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid hsla(0 0% 100%, 0.25);
    border-radius: var(--radius-card);
    padding: 2.5rem 2rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .logo {
    display: flex; align-items: center; justify-content: center; gap: 0.625rem;
    margin-bottom: 1.75rem;
  }
  .logo .mark {
    width: 2.5rem; height: 2.5rem; border-radius: 0.75rem;
    background: hsla(0 0% 100%, 0.18);
    border: 1px solid hsla(0 0% 100%, 0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .logo .mark svg { width: 1.25rem; height: 1.25rem; }
  .logo .name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
  h2 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.375rem; }
  .sub { font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 2rem; }

  form { display: flex; flex-direction: column; gap: 1.125rem; }
  .field { display: flex; flex-direction: column; gap: 0.375rem; }
  label { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }
  .input-wrap { position: relative; }
  .input-wrap svg { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); width: 1rem; height: 1rem; color: var(--text-subtle); }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 0.625rem 1rem 0.625rem 2.5rem;
    background: hsla(0 0% 100%, 0.12);
    border: 1px solid hsla(0 0% 100%, 0.22);
    border-radius: var(--radius-base);
    font-size: 0.875rem; color: #fff;
    min-height: 44px;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--text-subtle); }
  input:focus {
    outline: none;
    border-color: hsla(0 0% 100%, 0.6);
    background: hsla(0 0% 100%, 0.18);
    box-shadow: 0 0 0 3px hsla(175 84% 60% / 0.35);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .remember { display: flex; align-items: center; gap: 0.5rem; }
  .remember input { width: 1rem; height: 1rem; accent-color: hsl(175 84% 50%); cursor: pointer; }
  .remember label { font-size: 0.8rem; color: var(--text-muted); cursor: pointer; }
  .forgot { font-size: 0.8rem; color: #fff; text-decoration: none; font-weight: 500; }
  .forgot:hover { text-decoration: underline; }
  .btn {
    width: 100%; padding: 0.625rem 1rem;
    background: hsla(175 84% 50%, 0.9);
    color: #fff;
    border: 1px solid hsla(0 0% 100%, 0.3);
    border-radius: var(--radius-base);
    font-size: 0.875rem; font-weight: 600;
    min-height: 44px; cursor: pointer; margin-top: 0.25rem;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: hsl(175 84% 42%); }
  .btn:active { transform: scale(0.98); }
  .footer { text-align: center; margin-top: 1.75rem; font-size: 0.72rem; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-label="Service Hub">
      <div class="mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </div>
      <div class="name">Service Hub</div>
    </div>

    <h2>Sign in</h2>
    <p class="sub">Access your multi-app platform.</p>

    <form onsubmit="event.preventDefault()">
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="username" type="text" placeholder="Username" autocomplete="username" />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        </div>
      </div>

      <div class="row">
        <div class="remember">
          <input id="remember-me" type="checkbox" />
          <label for="remember-me">Remember me</label>
        </div>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Sign in</button>
    </form>

    <p class="footer">© 2026 Service Hub</p>
  </div>
</body>
</html>
