<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service Hub — Login (Minimal Centered Card)</title>
<style>
  :root {
    --primary:            hsl(175 84% 32%);
    --primary-hover:      hsl(175 77% 26%);
    --primary-foreground: hsl(0 0% 100%);
    --surface:            hsl(0 0% 100%);
    --border:             hsl(214 32% 91%);
    --text-base:          hsl(176 21% 14%);
    --text-muted:         hsl(215 16% 47%);
    --text-subtle:        hsl(215 20% 65%);
    --radius-base: 10px;
    --radius-card: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    /* subtle solid teal-tinted background */
    background: hsl(175 30% 97%);
    color: var(--text-base);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 22rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 2.5rem 2rem;
  }
  .logo {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    margin-bottom: 1.75rem;
  }
  .logo .mark {
    width: 2rem; height: 2rem; border-radius: 0.5rem;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .logo .mark svg { width: 1.125rem; height: 1.125rem; }
  .logo .name { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
  .logo .name span { color: var(--primary); }
  h2 { font-size: 1.25rem; font-weight: 600; text-align: center; margin-bottom: 0.25rem; }
  .sub { font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 1.75rem; }
  form { display: flex; flex-direction: column; gap: 1.125rem; }
  .field { display: flex; flex-direction: column; gap: 0.375rem; }
  label { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 0.625rem 0.75rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-base); font-size: 0.875rem; color: var(--text-base);
    min-height: 42px; transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--text-subtle); }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px hsl(175 84% 32% / 0.3); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .remember { display: flex; align-items: center; gap: 0.5rem; }
  .remember input { width: 1rem; height: 1rem; accent-color: var(--primary); cursor: pointer; }
  .remember label { font-size: 0.8rem; color: var(--text-muted); cursor: pointer; }
  .forgot { font-size: 0.8rem; color: var(--primary); text-decoration: none; font-weight: 500; }
  .forgot:hover { color: var(--primary-hover); text-decoration: underline; }
  .btn {
    width: 100%; padding: 0.625rem 1rem; background: var(--primary); color: #fff;
    border: none; border-radius: var(--radius-base); font-size: 0.875rem; font-weight: 500;
    min-height: 42px; cursor: pointer; margin-top: 0.25rem;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn:active { transform: scale(0.98); }
  .footer { text-align: center; margin-top: 1.75rem; font-size: 0.72rem; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-label="Service Hub">
      <div class="mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      </div>
      <div class="name">Service<span>Hub</span></div>
    </div>

    <h2>Sign in</h2>
    <p class="sub">Enter your credentials to continue.</p>

    <form onsubmit="event.preventDefault()">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      </div>

      <div class="row">
        <div class="remember">
          <input id="remember-me" type="checkbox" />
          <label for="remember-me">Remember me</label>
        </div>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Sign in</button>
    </form>

    <p class="footer">© 2026 Service Hub</p>
  </div>
</body>
</html>
