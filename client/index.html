<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <title>Service Hub</title>
    <script>
      // No-FOUC: apply the stored (or OS) theme before first paint so the
      // very first render already matches. Kept in sync with themeStore.js.
      // Dark mode is an internal (admin) preference only — public site routes
      // always render light.
      (function () {
        try {
          var path = window.location.pathname;
          var isAdmin = path.indexOf('/hub-admin') === 0 || path === '/login';
          var stored = localStorage.getItem('theme');
          var dark = isAdmin && (stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches));
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
