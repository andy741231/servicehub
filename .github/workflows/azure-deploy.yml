name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. BUILD
  # Compile the client, generate Prisma, and assemble a self-contained
  # deploy.zip that is shared with every downstream job.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install all workspace dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build client (React/Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Prisma generate (with Windows binary for Azure)
        run: npx prisma generate

      - name: Run server unit tests
        run: npm -w server test

      - name: Check for schema/migration drift
        run: |
          # Static check: verify every model in schema.prisma has a
          # corresponding CREATE TABLE in the migration files.
          # This catches the common mistake of running `prisma db push`
          # without creating a migration file.
          MODELS=$(grep -oP '^model \K\w+' prisma/schema.prisma)
          MISSING=""
          for MODEL in $MODELS; do
            # Match both [dbo].[Model] and [Model] patterns
            if ! grep -rqE "CREATE TABLE.*\[$MODEL\]" prisma/migrations/ 2>/dev/null; then
              MISSING="$MISSING $MODEL"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Schema drift detected! The following models in schema.prisma"
            echo "::error::have no CREATE TABLE in any migration file:$MISSING"
            echo "::error::Production deploy uses 'prisma migrate deploy' which only"
            echo "::error::applies migration files. Run 'npx prisma db push' locally,"
            echo "::error::then create a migration file manually."
            echo "::error::See AGENT.md → 'Schema Change Workflow' for instructions."
            exit 1
          fi
          echo "All models have corresponding migrations — no drift detected."
          # Column-level check: every scalar field must appear as [field] in
          # migration SQL — catches columns added via db push without a
          # migration file (which the table check above can't see).
          node server/scripts/check-column-drift.mjs

      - name: Assemble self-contained deployment folder
        run: |
          mkdir -p deploy/client deploy/node_modules
          # Copy server source and CJS entry-point shim for iisnode
          cp -r server/src deploy/
          # server/scripts/ ships too — src/services/directorySms/settings.js
          # requires scripts/lib/helpTopics.json at module load; without it the
          # server crashes on boot (500 on every route, incl. /api/health).
          cp -r server/scripts deploy/
          cp server/app.cjs deploy/
          cp server/package.json deploy/
          # Copy built React frontend
          cp -r client/dist deploy/client/dist
          # Copy prisma schema and generated client
          cp -r prisma deploy/
          cp -r node_modules/@prisma deploy/node_modules/@prisma
          cp -r node_modules/.prisma deploy/node_modules/.prisma
          # Copy web.config for IIS/iisnode on Windows Azure App Service
          cp web.config deploy/
          cd deploy
          # Remove workspace refs BEFORE install — 'shared': '*' otherwise
          # resolves to the unrelated npm-registry package and the server
          # crashes at startup on `import ... from 'shared'`.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            delete pkg.dependencies?.shared;
            delete pkg.devDependencies?.shared;
            delete pkg.workspaces;
            pkg.scripts = { start: 'node src/index.js' };
            pkg.engines = { node: '>=20' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          # Stamp build metadata so /api/health reports the running commit SHA
          node -e "
            const fs = require('fs');
            fs.writeFileSync('build-info.json', JSON.stringify({
              commit: process.env.GITHUB_SHA,
              builtAt: new Date().toISOString(),
            }, null, 2));
          "
          # Install server production dependencies standalone (no workspaces)
          npm install --omit=dev --ignore-scripts
          # Inject the real workspace 'shared' package (npm can't install it)
          rm -rf node_modules/shared
          cp -r ../shared node_modules/shared
          # Verify the standalone bundle imports cleanly before zipping
          # (catches missing files like server/scripts or broken workspace deps)
          node --input-type=module -e "
            await import('./src/routes/index.js');
            await import('./src/jobs/index.js');
            console.log('Deploy bundle import verification passed.');
            process.exit(0);
          "
          cd ..
          echo "Deploy folder size: $(du -sh deploy | cut -f1)"

      - name: Create deployment zip
        run: |
          cd deploy
          zip -r ../deploy.zip . -x "*.git*"
          cd ..
          echo "Zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: deploy.zip
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # 2. DEPLOY TO STAGING
  # Push the zip to the staging slot via Kudu Zip Deploy API.
  # The staging slot URL is:  houstonservicehub-staging.azurewebsites.net
  # ──────────────────────────────────────────────────────────────────────────
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (needed for prisma/schema.prisma)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (for Prisma CLI)
        run: npm ci
        env:
          HUSKY: 0

      - name: Resolve any failed migrations in staging
        run: |
          npx prisma migrate resolve --applied "0_init" || true
          npx prisma migrate resolve --applied "20260625_add_web_section_and_draft_templates" || true
          npx prisma migrate resolve --applied "20260629_cleanupmigrations_remove_redundant_manual_migratio" || true
          npx prisma migrate resolve --applied "20260630_feat_form_version_history" || true
          npx prisma migrate resolve --applied "20260630_fixdb_guard_updatedat_column_add_and_resolve_faile" || true
          npx prisma migrate resolve --applied "20260707_add_user_preferences" || true
          npx prisma migrate resolve --applied "20260711_add_form_folder_table" || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Apply database migrations to staging
        run: |
          if ! npx prisma migrate deploy; then
            echo "First attempt failed — the free serverless stage DB may be auto-paused. Retrying in 30s..."
            sleep 30
            npx prisma migrate deploy
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip

      - name: Deploy to staging slot via Kudu
        id: kudu
        env:
          KUDU_USER: ${{ secrets.AZURE_DEPLOY_USER_STAGING }}
          KUDU_PWD: ${{ secrets.AZURE_DEPLOY_PWD_STAGING }}
        run: |
          HTTP=$(curl -sS -D kudu_headers.txt -o kudu_body.txt -w "%{http_code}" -X POST \
            -u "${KUDU_USER}:${KUDU_PWD}" \
            "https://houstonservicehub-staging.scm.azurewebsites.net/api/zipdeploy?isAsync=true" \
            --data-binary @deploy.zip \
            -H "Content-Type: application/zip" \
            --max-time 300)
          echo "Kudu staging response: HTTP $HTTP"
          if [ "$HTTP" != "202" ] && [ "$HTTP" != "200" ]; then
            cat kudu_body.txt
            echo "Staging deploy request failed with HTTP $HTTP"
            exit 1
          fi
          POLL_URL=$(grep -i '^location:' kudu_headers.txt | awk '{print $2}' | tr -d '\r\n' || true)
          if [ -z "$POLL_URL" ]; then
            POLL_URL="https://houstonservicehub-staging.scm.azurewebsites.net/api/deployments/latest"
          fi
          echo "poll_url=$POLL_URL" >> "$GITHUB_OUTPUT"
          echo "Staging deployment accepted by Azure (async). Polling: $POLL_URL"

      - name: Wait for staging deployment to finish
        env:
          KUDU_USER: ${{ secrets.AZURE_DEPLOY_USER_STAGING }}
          KUDU_PWD: ${{ secrets.AZURE_DEPLOY_PWD_STAGING }}
          POLL_URL: ${{ steps.kudu.outputs.poll_url }}
        run: |
          echo "Polling Kudu for deployment status..."
          # Poll up to 40 min (160 x 15s) to survive cold SCM sandboxes while
          # finishing quickly under WEBSITE_RUN_FROM_PACKAGE=1.
          for i in $(seq 1 160); do
            STATUS=$(curl -s \
              -u "${KUDU_USER}:${KUDU_PWD}" \
              "$POLL_URL" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',0))" 2>/dev/null || echo "0")
            echo "Attempt $i — deployment status: $STATUS"
            # status 4 = success, status 3 = failed
            if [ "$STATUS" = "4" ]; then
              echo "Staging deployment succeeded."
              exit 0
            fi
            if [ "$STATUS" = "3" ]; then
              echo "Staging deployment failed."
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for staging deployment."
          exit 1

  # ──────────────────────────────────────────────────────────────────────────
  # 3. SMOKE TESTS
  # Hit critical endpoints on the staging slot and verify the new commit SHA
  # is live. If any check fails the pipeline stops and production is untouched.
  # ──────────────────────────────────────────────────────────────────────────
  smoke-tests:
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: Wait for staging /api/health to report this commit (HTTP 200)
        run: |
          EXPECTED="${{ github.sha }}"
          for i in $(seq 1 18); do
            RESP=$(curl -s -w "\n%{http_code}" \
              --max-time 30 \
              "https://houstonservicehub-staging.azurewebsites.net/api/health" || true)
            STATUS=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            COMMIT=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
            echo "Attempt $i — health HTTP $STATUS, commit=${COMMIT:-none} (expected ${EXPECTED:0:7})"
            if [ "$STATUS" = "200" ] && [ "$COMMIT" = "$EXPECTED" ]; then
              echo "Staging is healthy on commit ${EXPECTED:0:7}."
              exit 0
            fi
            sleep 10
          done
          echo "Staging health/commit smoke test FAILED after 18 attempts (last HTTP $STATUS, commit=${COMMIT:-none})"
          exit 1

      - name: Health check — homepage (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://houstonservicehub-staging.azurewebsites.net/" || true)
          echo "Homepage status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Homepage smoke test FAILED (got $STATUS)"
            exit 1
          fi

      - name: Health check — auth login page (HTTP 200)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://houstonservicehub-staging.azurewebsites.net/login" || true)
          echo "Login page status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Login page smoke test FAILED (got $STATUS)"
            exit 1
          fi

      # Exercises a real Prisma -> DB query, not just the static SPA shell or
      # the DB-free /api/health. A missing-column schema gap 500s here instead
      # of sailing through to production.
      - name: Health check — page data API (DB-backed)
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              "https://houstonservicehub-staging.azurewebsites.net/api/web/page/home" || true)
            echo "Page data status (attempt $i): $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Page data smoke test FAILED after 6 attempts (last: $STATUS)"
          exit 1

      - name: Health check — Directory SMS & auth guards
        run: |
          SMS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            --max-time 30 \
            "https://houstonservicehub-staging.azurewebsites.net/api/directory/sms" || true)
          echo "Directory SMS (unsigned POST) status: $SMS_STATUS"
          if [ "$SMS_STATUS" != "403" ]; then
            echo "Directory SMS guard check FAILED (expected 403, got $SMS_STATUS)"
            exit 1
          fi
          DIR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://houstonservicehub-staging.azurewebsites.net/api/directory/members" || true)
          echo "Directory members (unauth GET) status: $DIR_STATUS"
          if [ "$DIR_STATUS" != "401" ]; then
            echo "Directory auth guard check FAILED (expected 401, got $DIR_STATUS)"
            exit 1
          fi

      - name: All smoke tests passed
        run: echo "All staging smoke tests passed — proceeding to production deploy."

  # ──────────────────────────────────────────────────────────────────────────
  # 4. DEPLOY TO PRODUCTION (STAGING-GATED)
  # Auto-swap is OFF (since 2026-10-18) so smoke tests gate promotion.
  # Once staging passes every check above, this job:
  #   a) Applies DB migrations to production
  #   b) Deploys the exact same verified deploy.zip to production via Kudu
  #   c) Verifies production /api/health reports this commit SHA + DB & SMS
  # (Future upgrade: swap via OIDC `az webapp deployment slot swap` once an
  # Azure Owner grants Website Contributor to `github-servicehub-deploy`.)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-production:
    needs: smoke-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (needed for Prisma CLI)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (for Prisma CLI)
        run: npm ci
        env:
          HUSKY: 0

      - name: Resolve any failed migrations in production
        run: |
          npx prisma migrate resolve --applied "0_init" || true
          npx prisma migrate resolve --applied "20260625_add_web_section_and_draft_templates" || true
          npx prisma migrate resolve --applied "20260629_cleanupmigrations_remove_redundant_manual_migratio" || true
          npx prisma migrate resolve --applied "20260630_feat_form_version_history" || true
          npx prisma migrate resolve --applied "20260630_fixdb_guard_updatedat_column_add_and_resolve_faile" || true
          npx prisma migrate resolve --applied "20260707_add_user_preferences" || true
          npx prisma migrate resolve --applied "20260711_add_form_folder_table" || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Apply database migrations to production
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Download verified deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip

      - name: Deploy to production via Kudu
        id: kudu
        env:
          KUDU_USER: ${{ secrets.AZURE_DEPLOY_USER }}
          KUDU_PWD: ${{ secrets.AZURE_DEPLOY_PWD }}
        run: |
          HTTP=$(curl -sS -D kudu_headers.txt -o kudu_body.txt -w "%{http_code}" -X POST \
            -u "${KUDU_USER}:${KUDU_PWD}" \
            "https://houstonservicehub.scm.azurewebsites.net/api/zipdeploy?isAsync=true" \
            --data-binary @deploy.zip \
            -H "Content-Type: application/zip" \
            --max-time 300)
          echo "Kudu production response: HTTP $HTTP"
          if [ "$HTTP" != "202" ] && [ "$HTTP" != "200" ]; then
            cat kudu_body.txt
            echo "Production deploy request failed with HTTP $HTTP"
            exit 1
          fi
          POLL_URL=$(grep -i '^location:' kudu_headers.txt | awk '{print $2}' | tr -d '\r\n' || true)
          if [ -z "$POLL_URL" ]; then
            POLL_URL="https://houstonservicehub.scm.azurewebsites.net/api/deployments/latest"
          fi
          echo "poll_url=$POLL_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment accepted by Azure (async). Polling: $POLL_URL"

      - name: Wait for production deployment to finish
        env:
          KUDU_USER: ${{ secrets.AZURE_DEPLOY_USER }}
          KUDU_PWD: ${{ secrets.AZURE_DEPLOY_PWD }}
          POLL_URL: ${{ steps.kudu.outputs.poll_url }}
        run: |
          echo "Polling Kudu for production deployment status..."
          for i in $(seq 1 160); do
            STATUS=$(curl -s \
              -u "${KUDU_USER}:${KUDU_PWD}" \
              "$POLL_URL" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',0))" 2>/dev/null || echo "0")
            echo "Attempt $i — deployment status: $STATUS"
            # status 4 = success, status 3 = failed
            if [ "$STATUS" = "4" ]; then
              echo "Production deployment succeeded."
              exit 0
            fi
            if [ "$STATUS" = "3" ]; then
              echo "Production deployment failed."
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for production deployment."
          exit 1

      - name: Verify production /api/health reports this commit (HTTP 200)
        run: |
          EXPECTED="${{ github.sha }}"
          for i in $(seq 1 18); do
            RESP=$(curl -s -w "\n%{http_code}" \
              --max-time 30 \
              "https://houstonservicehub.azurewebsites.net/api/health" || true)
            STATUS=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | sed '$d')
            COMMIT=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
            echo "Attempt $i — prod health HTTP $STATUS, commit=${COMMIT:-none} (expected ${EXPECTED:0:7})"
            if [ "$STATUS" = "200" ] && [ "$COMMIT" = "$EXPECTED" ]; then
              echo "Production is healthy on commit ${EXPECTED:0:7}."
              exit 0
            fi
            sleep 10
          done
          echo "Production health/commit check FAILED after 18 attempts (last HTTP $STATUS, commit=${COMMIT:-none})"
          exit 1

      # Same DB-backed check on production — verifies live production serves
      # data cleanly against the migrated schema.
      - name: Verify production serves page data (DB-backed)
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              "https://houstonservicehub.azurewebsites.net/api/web/page/home" || true)
            echo "Page data status (attempt $i): $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Production page data check FAILED (last: $STATUS)"
          exit 1

      - name: Verify production Directory SMS & auth guards
        run: |
          SMS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            --max-time 30 \
            "https://houstonservicehub.azurewebsites.net/api/directory/sms" || true)
          echo "Production Directory SMS (unsigned POST) status: $SMS_STATUS"
          if [ "$SMS_STATUS" != "403" ]; then
            echo "Production Directory SMS guard check FAILED (expected 403, got $SMS_STATUS)"
            exit 1
          fi
          DIR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://houstonservicehub.azurewebsites.net/api/directory/members" || true)
          echo "Production Directory members (unauth GET) status: $DIR_STATUS"
          if [ "$DIR_STATUS" != "401" ]; then
            echo "Production Directory auth guard check FAILED (expected 401, got $DIR_STATUS)"
            exit 1
          fi

      - name: Write deployment summary
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Deployed \`${SHORT_SHA}\` to Staging & Production

          - **Staging:** https://houstonservicehub-staging.azurewebsites.net (verified on \`${SHORT_SHA}\`)
          - **Production:** https://houstonservicehub.azurewebsites.net (verified on \`${SHORT_SHA}\`)
          - **Checks passed:** unit tests, schema/column drift, bundle imports, staging smoke tests, prod migrations, prod health + commit SHA + DB + Directory guards
          EOF
